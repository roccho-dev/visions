name: verify-and-package
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          submodules: true
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Contracts, privacy, projection and local HTTP
        if: runner.os != 'Windows'
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Windows build, publish, HTTP and synthetic UIA probe
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build.ps1 -Publish
      - name: Downloadable preview
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: visions-win-x64-preview
          path: |
            dist/*.dist.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14
