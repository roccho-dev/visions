name: verify-and-package
on:
  pull_request:
  push:
    branches: [main, 'feat/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Contracts, privacy, projection and local HTTP
        if: runner.os != 'Windows'
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Windows build, self-contained publish and executable smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build.ps1 -Publish
      - name: Downloadable preview
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: visions-win-x64-preview
          path: |
            dist/*.dist.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14
