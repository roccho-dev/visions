<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>visions — 流れ・時間・根拠</title><link rel="stylesheet" href="style.css"><script src="app.js" defer></script></head>
<body><header><div><span class="eyebrow">VISIONS · LOCAL / READ ONLY</span><h1>何が、どの順に起きたか。</h1><p>観測事実から流れを見る。業務名・作業時間・完了は推測しません。</p></div><button id="refresh">再読込</button></header>
<main><section class="status"><div><strong id="count">0</strong><span>観測ステップ</span></div><div><strong id="edge-count">0</strong><span>根拠のある遷移</span></div><div><strong id="artifact-count">0</strong><span>取り込んだ出力</span></div><p id="coverage">未読込</p></section>
<section id="warnings" aria-live="polite"></section><div class="columns"><section><h2>01 / 流れ</h2><p>同一の記録区間・取得元だけを結びます。反復は手戻りとは限りません。</p><div id="flow" class="flow"></div><h2>02 / 経過</h2><div class="scroll"><table><thead><tr><th>順序</th><th>観測時刻</th><th>対象</th><th>直前からの経過</th></tr></thead><tbody id="timeline"></tbody></table></div></section><aside><h2>03 / 根拠</h2><p>ステップを選ぶと元のRecordを表示します。</p><pre id="evidence">まだ選択されていません。</pre><h3>出力ファイルの参照</h3><div id="artifacts"></div><p class="note">本体の内容・元のファイル名は配信しません。保存場所はWindowsアプリから確認できます。</p></aside></div><footer id="version"></footer></main></body></html>
